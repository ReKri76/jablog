<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
    <body>
        <div>
            <span th:each="board : ${boards}">
                <span>
                    <a th:href="@{/{name}(name=${board})}"
                       th:text="${board}">
                        name
                    </a>
                    <br>
                </span>
            </span>
        </div>
    </body>
</html>
