<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
    <body>
        <table>
            <tr th:each="board : ${boards}">
                <td>
                    <a th:href="@{/{name}(name=${board})}"

                        name

                </td>
            </tr>
        </table>
    </body>
</html>
