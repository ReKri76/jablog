<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Board</title>
    <link rel="stylesheet" th:href="@{/styles/index.css}"/>
    <script th:src="@{/script/js/htmx.min.js}" type="text/javascript"></script>
</head>
<body th:hx-headers='|{"X-CSRF-TOKEN": "${_csrf.token}"}|'>
<main class="page stack">
    <header class="page-header">
        <h1 class="page-title" th:text="'/' + ${boardName} + '/'">/board/</h1>
    </header>

    <div class="split-layout">
        <section class="panel">
            <h2 class="panel-title">Треды</h2>
            <div class="panel-body">
                <div class="post-list">
                    <article class="post-card" th:each="thread : ${threads}">
                        <div class="post-meta">
                            <a class="post-id"
                               th:href="@{/{boardName}/{threadId}(boardName=${boardName}, threadId=${thread.id})}"
                               th:text="${thread.id}"
                               th:id="${thread.id}">
                                id
                            </a>
                            <span th:href="@{/{boardName}/{threadId}(boardName=${boardName}, threadId=${thread.id})}"
                                  class="post-head" th:text="${thread.head}">head</span>
                        </div>
                        <p class="post-body" th:text="${thread.body}">body</p>
                        <img class="post-image" th:if="${thread.url}" th:src="${thread.url}" alt="picture" loading="lazy"/>

                        <div class="post-actions">
                            <div class="post-karma">
                                <button type="button"
                                        class="karma-btn"
                                        title="Повысить карму"
                                        th:hx-patch="@{/api/carma/plus/{boardName}/{threadId}(boardName=${boardName}, threadId=${thread.id})}"
                                        th:hx-target="closest .post-karma"
                                        th:hx-swap="outerHTML">
                                    ▲
                                </button>

                                <span class="karma-value" th:text="${thread.karma != null ? thread.karma : 0}">0</span>

                                <button type="button"
                                        class="karma-btn"
                                        title="Понизить карму"
                                        th:hx-patch="@{/api/carma/minus/{boardName}/{threadId}(boardName=${boardName}, threadId=${thread.id})}"
                                        th:hx-target="closest .post-karma"
                                        th:hx-swap="outerHTML">
                                    ▼
                                </button>
                            </div>

                            <button th:if="${canDelete}"
                                    th:hx-delete="@{/deleter/{boardName}/{threadId}(boardName=${boardName}, threadId=${thread.id})}">
                                delete thread
                            </button>
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title">Новый тред</h2>
            <div class="panel-body">
                <form method="post"
                      th:action="@{/poster/{boardName}(boardName=${boardName})}"
                      enctype="multipart/form-data"
                      th:object="${post}"
                      class="form-grid">

                    <label class="field" for="head">
                        <span>Head</span>
                        <input type="text" th:field="*{head}" id="head">
                    </label>

                    <label class="field" for="body">
                        <span>Body</span>
                        <textarea th:field="*{body}" id="body" rows="6"></textarea>
                    </label>

                    <label class="field" for="image">
                        <span>Image</span>
                        <input class="file-input" type="file" name="image" id="image" accept="image/*"/>
                    </label>

                    <div class="form-actions">
                        <button type="submit">Создать</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <nav class="footer-links">
        <a href="/">home</a>
    </nav>
</main>
</body>
</html>
