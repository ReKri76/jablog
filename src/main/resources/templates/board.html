<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
    <body>
        <div>
            <span th:each="thread :${threads}">
                <a
                    th:href="@{/{boardName}/{thread.id}}"
                    th:text="${thread.id}"
                    id="${thread.id}">
                    id
                </a>
                <span th:text="${thread.head}">head</span>
                <span th:text="${thread.body}">name</span>
                <img th:src="${thread.url}" alt="picture"/>
                <br>
            </span>
        </div>

        <form method="post"
              th:action="@{/${boardName}/}"
              enctype="multipart/form-data">

        </form>
    </body>
</html>
