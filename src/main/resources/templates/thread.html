<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thread</title>
    <script th:src="@{/script/js/htmx.min.js}" type="text/javascript"></script>
</head>
    <body th:hx-headers='|{"X-CSRF-TOKEN": "${_csrf.token}"}|'>
        <div>
            <span th:text="${thread.head}">head</span>
            <span th:text="${thread.body}">body</span>
            <img th:src="${thread.url}" alt="picture"/>
            <br>
        </div>

        <div th:each="currentPost :${posts}">
            <span th:id="'p' + ${currentPost.id}">
                <span th:text="${currentPost.id}">id</span>
                <span th:text="${currentPost.head}">head</span>
                <span th:utext="${currentPost.body}">body</span>
                <img th:src="${currentPost.url}"/>
                <span th:if="${canDelete}">
                    <button
                         th:hx-delete="@{/deleter/{boardName}/{postId}
                        (boardName=${boardName}, threadId=${thread.id}, postId=${currentPost.id})}">
                    delete post
                    </button>
                </span>
                <br>
            </span>
        </div>

        <form method="post"
              th:action="@{/poster/{boardName}/{threadId}(boardName=${boardName}, threadId=${thread.id})}"
              enctype="multipart/form-data"
              th:object="${post}">

            <label for="head">head:</label>
            <input type="text" th:field="*{head}" id="head">

            <label for="body">body</label>
            <textarea th:field="*{body}" id="body" rows="6"></textarea>

            <input type="file" name="image" accept="image/*"/>

            <button type="submit">create</button>
        </form>
        <a href="/">home</a>
    </body>
</html>
