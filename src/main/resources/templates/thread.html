<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
    <body>
        <ul>
            <li th:each="post :${posts}" id="${post.id}">
                <span th:text="${post.id}">id</span>
                <span th:text="${post.body}">body</span>
                <img th:src="${post.url}" alt="picture"/>
            </li>
        </ul>
    </body>
</html>
